title: Soy-Garlic Chicken and Rice
total_time: 25 minutes
serving_size: 2
spice_index: none
tags:
  - asian
  - rice
  - main

components:
  - name: Soy-Garlic Pan Sauce
    ingredients:
      - item: neutral oil
        quantity: 1 tsp
      - item: garlic, finely minced
        quantity: 3 cloves
      - item: fresh ginger, grated
        quantity: 1 tsp
      - item: water
        quantity: 80ml
      - item: light soy sauce
        quantity: 3 tbsp
      - item: dark soy sauce
        quantity: 1 1/2 tsp
      - item: brown sugar
        quantity: 1 1/2 tbsp
      - item: cider vinegar
        quantity: 1 tbsp

    method:
      - Start this when the chicken has about 10 minutes left.
      - Heat the oil in a small saucepan over medium heat.
      - Add the garlic and ginger and cook for 30 seconds, stirring constantly. Do not let the garlic brown.
      - Add the water, both soy sauces and the brown sugar. Bring to a simmer.
      - Simmer for 4-6 minutes until syrupy and it coats the back of a spoon. No cornflour needed - the reduction does the thickening.
      - Take off the heat and stir in the cider vinegar. Taste and add more vinegar if it tastes too sweet.
      - Keep it slightly looser than a glaze, since the chicken needs enough sauce to coat it properly.

  - name: Chicken
    ingredients:
      - item: chicken breast
        quantity: 1 large per person
      - item: neutral oil
        quantity: 1 tbsp
      - item: salt
        quantity: 1/2 tsp
      - item: red bell peppers
        quantity: "2"
      - item: green onions
        quantity: "3"

    method:
      - Cut each chicken breast across the width into medallions, 2cm to 2.5cm thick. Any thinner and they dry out.
      - Toss with the oil and salt.
      - Slice the peppers into large chunks.
      - Put the peppers and chicken into a 200C oven on separate trays.
      - Peppers take 20 minutes. Chicken takes 15-18 minutes - pull it as soon as the thickest part is opaque, or at 70C internal.
      - Rest the chicken for 5 minutes, then tip any resting juices into the sauce.

plating:
  - Microwave some rice and put into a bowl.
  - Tip the cooked chicken into the saucepan and turn it through the sauce for 1 minute over low heat, so it takes on the flavour.
  - Put the cooked peppers on top of the rice
  - Put the chicken on top of the peppers and spoon the remaining sauce over
  - Top with green onion
  - Enjoy